- name: "Init Build Directory"
  hosts: local_build
  gather_facts: true
  vars_files:
    - vars.yml
  tasks:
    - name: "Définir un répertoire de build "
      set_fact:
        build_dir: "/tmp/build"
      run_once: true

    - name: Get short SHA from tag
      command: git rev-parse --short=8 "{{ git_tag }}^{commit}"
      args:
        chdir: "{{ PROJECT_URL }}"
      register: CI_COMMIT_SHORT_SHA
      changed_when: false
      debug:
        msg: "Tag {{ git_tag }} corresponds to commit short SHA {{ CI_COMMIT_SHORT_SHA.stdout }}"




- name: "Build Application"
  hosts: local_build
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: "Étape 1: Build de l'application"
      import_tasks: build.yml


- name: "Deploy to Servers"
  hosts: node_server
  gather_facts: true
  vars_files:
    - vars.yml
  tasks:
    - name: "Vérifier l'existence du fichier CI_COMMIT_SHORT_SHA"
      stat:
        path: "{{ LOCATION_PATH }}/{{ CI_PROJECT_NAME }}/.{{ CI_COMMIT_SHORT_SHA }}."
      register: commit_file_check
      become: true

    - block:
        - name: "Installation système"
          include_tasks: system_install.yml
          vars:
            setup_system: true

        - name: "Déploiement de l'application"
          include_tasks: deploy.yml
      when: not commit_file_check.stat.exists or force | default(false) | bool
  
  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes
      become: true
    
    - name: "reload ssh"
      service:
        name: ssh
        state: restarted
  

  
- name: "Cleanup"
  hosts: local_build
  gather_facts: false
  vars_files:
    - vars.yml
  tasks:
    - name: "Nettoyage des fichiers temporaires de build"
      file:
        path: "{{ build_dir }}"
        state: absent
      ignore_errors: true

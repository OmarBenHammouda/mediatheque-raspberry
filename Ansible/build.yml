
- name: Lister tous les tags distants
  command:
    argv:
      - git
      - ls-remote
      - --tags
      - "https://gitlab-ci-token:{{ TOKEN }}@github.com/{{ PROJECT_URL }}.git"
  register: tags_raw
  no_log: true  

- name: Vérifier que le tag existe
  fail:
    msg: "Le tag {{ CI_TAG }} n'existe pas ou accès refusé"
  when: >
    (tags_raw.stdout_lines | select('search', 'refs/tags/' ~ CI_TAG ~ '$') | list | length) == 0

- name: Extraire le short SHA du tag choisi
  set_fact:
    CI_COMMIT_SHORT_SHA: >-
      {{
        (tags_raw.stdout_lines
         | select('search', 'refs/tags/' ~ CI_TAG ~ '(\^{}|$)')
         | list
         | last
        ).split()[0][:8]
      }}
      
- name: Afficher le short SHA
  debug:
    msg: "Short SHA du tag {{ CI_TAG }} = {{ CI_COMMIT_SHORT_SHA }}"



- name: "Installer Node.js via NVM"
  block:
    - name: Installer les dépendances nécessaires
      apt:
        name:
          - curl
          - git
          - netcat-openbsd
          - mc                
          - cec-utils  
        state: present
        update_cache: yes
      become: true

    - name: Créer le répertoire .nvm
      file:
        path: "/home/admin/.nvm"
        state: directory
        owner: admin
        group: admin
        mode: '0755'
      become: true

    - name: Installer NVM et Node.js 
      shell: |
        {{ nvm_load }}

        # Installer NVM si absent

        if [ ! -s "$NVM_DIR/nvm.sh" ]; then
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
        fi

        # Recharger NVM pour s'assurer qu'il est bien disponible

        {{ nvm_load }}

        # Installer Node.js et le définir par défaut
        nvm install {{ node_version }} || true
        nvm alias default {{ node_version }}
        nvm use default
      args:
        executable: /bin/bash
      become: true
      become_user: admin
      environment:
        HOME: /home/admin
      register: node_install

- name: Ensure Git is installed
  ansible.builtin.package:
    name: git
    state: present

- name: "Préparer les répertoires de cache pour admin"
  file:
    path: "{{ item }}"
    state: directory
    owner: admin
    group: admin
    mode: '0755'
  become: true
  loop:
    - "/home/admin/.cache"
    - "/home/admin/.npm"
    - "/home/admin/.config"

- name: "Supprimer le répertoire de build s'il existe"
  file:
    path: "{{ build_dir }}"
    state: absent
  become: true

- name: "Créer un répertoire de build vide"
  file:
    path: "{{ build_dir }}"
    state: directory
    owner: admin
    group: admin
    mode: '0755'
  become: true

- name: "Clone du repository"
  git:
    repo: "https://oauth:{{ TOKEN }}@{{ REGISTRY_HOST }}/{{ PROJECT_URL }}.git"
    dest: "{{ build_dir }}"
    version: "{{ CI_COMMIT_SHORT_SHA }}"
    force: true
  become: true
  become_user: admin
  register: git_clone_result

- name: "Affichage du commit utilisé"
  debug:
    msg: "Commit utilisé: {{ CI_COMMIT_SHORT_SHA}} ({{ git_clone_result.after }})"

- name: "Création d'un fichier vide avec le nom du commit"
  file:
    path: "{{ build_dir }}/.{{ CI_COMMIT_SHORT_SHA}}."
    state: touch
    owner: admin
    group: admin
    mode: '0644'
  become: true

- name: "Vérification du fichier package.json"
  stat:
    path: "{{ build_dir }}/package.json"
  register: package_json

- name: "Installation des dépendances NPM"
  shell: |
    {{ nvm_load }}
    nvm use {{ node_version }}
    
    # Nettoyer le cache npm
    npm cache clean --force 2>/dev/null || true
    
    # Installer les dépendances
    npm install --omit=dev
  args:
    executable: /bin/bash
    chdir: "{{ build_dir }}"
  become: true
  become_user: admin
  environment:
    HOME: /home/admin
  when: package_json.stat.exists

- name: "Suppression des fichiers inutiles pour le déploiement"
  file:
    path: "{{ build_dir }}/{{ item }}"
    state: absent
  loop:
    - ".git"
    - ".gitignore"
    - "README.md"
  ignore_errors: true

- name: "Création de l'archive complète du projet"
  archive:
    path: "{{ build_dir }}/"
    dest: "{{ build_dir }}/{{ project_archive }}"
    format: gz
    exclude_path:
      - "{{ build_dir }}/{{ project_archive }}"

- name: "Vérification de l'archive créée"
  stat:
    path: "{{ build_dir }}/{{ project_archive }}"
  register: project_archive_stat

- name: "Message de succès"
  debug:
    msg: "✅ Archive du projet créée : {{ project_archive_stat.stat.path }}"
  when: project_archive_stat.stat.exists

- name: "Message d'erreur si archive absente"
  fail:
    msg: "❌ L'archive du projet n'a pas pu être créée !"
  when: not project_archive_stat.stat.exists


- name: "Création du groupe applicatif"
  group:
    name: "{{ app_group }}"
    state: present
  become: true

- name: "Création de l'utilisateur applicatif"
  user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    home: "{{ LOCATION_PATH }}"
    shell: /bin/bash
    create_home: true
    state: present
  become: true


- name: "Nettoyage du répertoire d'application existant"
  file:
    path: "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}"
    state: absent
  become: true


- name: "Création des répertoires applicatifs"
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  loop:
    - "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}"
    - "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}/logs"
    - "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}/releases"  
  become: true


- name: Installer Node.js et PM2
  become: true
  block:
    - name: Vérifier si node est installé
      ansible.builtin.command: node -v
      register: node_check
      ignore_errors: true

    - name: Extraire version actuelle de Node.js
      set_fact:
        node_current_version: "{{ node_check.stdout | regex_replace('^v', '') }}"
      when: node_check.rc == 0

    - name: Ajouter le dépôt NodeSource
      ansible.builtin.shell: |
         curl -fsSL https://deb.nodesource.com/setup_{{ node_version }} | bash -
      args:
        executable: /bin/bash
      when: node_check.rc != 0 or
       (node_current_version is defined and
        (node_current_version.split('.')[0] != (node_version.split('.')[0])))

   
    - name: Installer Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: yes
      when: node_check.rc != 0 or
       (node_current_version is defined and 
       (node_current_version.split('.')[0] != (node_version.split('.')[0])))


    - name: Vérifier si le binaire "node" existe
      ansible.builtin.stat:
        path: /usr/bin/node
      register: node_bin

    

    - name: Installer PM2 globalement
      community.general.npm:
        name: pm2
        global: yes
        state: present


    - name: Générer service systemd  PM2
      become: yes
      become_user: "{{ app_user }}"
      shell: |
        pm2 startup systemd -u {{ app_user }} --hp /home/{{ app_user }}
        pm2 save

    - name: Activer et démarrer le service PM2 
      ansible.builtin.systemd:
        name: "pm2-{{ app_user }}"
        enabled: yes
        state: started
        daemon_reload: yes

# --- Rotation des logs ---
- name: "Configuration de la rotation des logs"
  copy:
    content: |
      {{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}/logs/*.log {
          daily
          rotate 7
          compress
          delaycompress
          missingok
          notifempty
          su {{ app_user }} {{ app_group }}
      }
    dest: "/etc/logrotate.d/{{ app_user }}"
    mode: '0644'
  become: true

- name: Add user to groups video, audio, and render
  user:
    name: "{{ app_user }}"
    groups: video,audio,render
    append: yes

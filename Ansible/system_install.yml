- name: "Installer Node.js"
  block:
    - name: Installer les dépendances
      apt:
        name:
          - curl
          - software-properties-common
          - gnupg
          - mc
          - netcat-openbsd
          - cec-utils
        state: present
        update_cache: yes

    - name: Ajouter la clé GPG de NodeSource
      apt_key:
        url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
        state: present

    - name: Ajouter le dépôt NodeSource
      apt_repository:
        repo: "deb https://deb.nodesource.com/node_{{ node_version }} nodistro main"
        state: present
        filename: nodesource

    - name: Installer Node.js et npm
      apt:
        name: nodejs
        state: present
        update_cache: yes

    - name: Installer build-essential
      apt:
        name: build-essential
        state: present


- name: "Installer Node.js via NVM"
  block:

    - name: Installer les dépendances nécessaires
      apt:
        name:
          - curl
          - ca-certificates
          - git
        state: present
        update_cache: yes
      become: true

    - name: Définir le chemin NVM 
      set_fact:
        nvm_dir: "/root/.nvm"

    - name: Installer NVM  et  Node.js
      shell: |
        export NVM_DIR="{{ nvm_dir }}"
        if [ ! -s "$NVM_DIR/nvm.sh" ]; then
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
        fi
        # Charger NVM
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        # Installer Node.js si non présent
        if ! nvm ls | grep -q "v{{ node_version }}"; then
          nvm install {{ node_version }}
          nvm alias default {{ node_version }}
        fi
        # Vérifier la version
        node -v
      args:
        executable: /bin/bash
      register: node_install
      become: true

# --- Rotation des logs ---
- name: Créer le groupe applicatif
  ansible.builtin.group:
    name: "{{ app_group }}"
    state: present

- name: Créer l'utilisateur applicatif
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    home: "{{ LOCATION_PATH }}"
    shell: "{{ shell }}"
    create_home: yes
    state: present

- name: "Configuration de la rotation des logs"
  copy:
    content: |
      {{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}/logs/*.log {
          daily
          rotate 7
          compress
          delaycompress
          missingok
          notifempty
          
      }
    dest: "/etc/logrotate.d/{{ app_user }}"
    mode: '0644'
  become: true

- name: "Créer le dossier SSH s'il n'existe pas"
  file:
    path: "{{ LOCATION_PATH }}/.ssh"
    state: directory
    mode: '0700'
    owner: "{{ app_user }}"
    group: "{{ app_group }}"


- name: "Assurer que AuthorizedKeysFile contient authorized_keys_gitlab"
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^AuthorizedKeysFile'
    line: 'AuthorizedKeysFile .ssh/authorized_keys .ssh/authorized_keys_gitlab'
    state: present
    backup: yes
  notify: reload ssh
  become: true

- name: "Récupérer la variable AUTHORIZED_KEYS "
  uri:
    url: "https://{{ REGISTRY_HOST }}/api/v4/projects/{{ project_id }}/variables/AUTHORIZED_KEYS"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ Env_token }}"
    return_content: yes
  register: gitlab_var

- name: "Extraire les clés SSH"
  set_fact:
    ssh_keys: "{{ gitlab_var.json.value.split('\n') }}"

- name: "Synchroniser les clés SSH"
  ansible.posix.authorized_key:
    user: "{{ app_user }}"
    key: "{{ ssh_keys | join('\n') }}"
    path: "/home/{{ app_user }}/.ssh/authorized_keys_gitlab"
    exclusive: yes
  notify: reload ssh

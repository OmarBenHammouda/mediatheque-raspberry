
- name: "Création du groupe applicatif"
  group:
    name: "{{ app_group }}"
    state: present
  become: true


- name: "Création de l'utilisateur applicatif"
  user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    home: "{{ LOCATION_PATH }}"
    shell: /bin/bash
    create_home: true
    state: present
  become: true


- name: "Installer Node.js et PM2 "
  block:
    - name: Installer les dépendances
      apt:
        name:
          - curl
          - software-properties-common
          - gnupg
          - mc
          - netcat-openbsd
          - cec-utils
        state: present
        update_cache: yes

    - name: Ajouter la clé GPG de NodeSource
      apt_key:
        url: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
        state: present

    - name: Ajouter le dépôt NodeSource
      apt_repository:
        repo: "deb https://deb.nodesource.com/node_{{ node_version }} nodistro main"
        state: present
        filename: nodesource

    - name: Installer Node.js et npm
      apt:
        name: nodejs
        state: present
        update_cache: yes

    - name: Installer build-essential
      apt:
        name: build-essential
        state: present

    - name: Installer PM2 globalement
      community.general.npm:
        name: pm2
        global: yes
        state: present

    - name: Générer service systemd  PM2
      become: yes
      shell: |
        env PATH=$PATH:/usr/bin pm2 startup systemd -u {{ app_user }} --hp /home/{{ app_user }}
        pm2 save

    - name: Activer et démarrer le service PM2 
      ansible.builtin.systemd:
        name: "pm2-{{ app_user }}"
        enabled: yes
        state: started
        daemon_reload: yes
      become: true


- name: "Créer le service systemd pour Raspberry Player"
  copy:
    content: |
      [Unit]
      Description=Raspberry Player - Médiathèque Digital Signage
      After=network.target

      [Service]
      Type=simple
      User={{ app_user }}
      WorkingDirectory={{ LOCATION_PATH }}/{{ CI_PROJECT_NAME }}
      ExecStartPre=/bin/sh -c 'sudo cp /home/admin/.Xauthority {{ LOCATION_PATH }}/.Xauthority && sudo chown {{ app_user }}:{{ app_group }} {{ LOCATION_PATH }}/.Xauthority'
      ExecStart=/usr/bin/npm start --prefix {{ LOCATION_PATH }}/{{ CI_PROJECT_NAME }}
      Restart=always
      RestartSec=10
      StandardOutput=journal
      StandardError=journal
      Environment=NODE_ENV=production
      Environment=DISPLAY=:0
      Environment=XDG_RUNTIME_DIR=/run/user/1001

      # Redémarrage automatique en cas d'échec
      RestartForceExitStatus=1
      RestartPreventExitStatus=0

      [Install]
      WantedBy=graphical.target
    dest: "/etc/systemd/system/raspberry-player.service"
    mode: '0644'
    owner: root
    group: root
  become: true
  notify: reload systemd

- name: "Recharger systemd et activer le service Raspberry Player"
  ansible.builtin.systemd:
    name: raspberry-player
    enabled: yes
    daemon_reload: yes
    state: started
  become: true


# --- Rotation des logs ---
- name: "Configuration de la rotation des logs"
  copy:
    content: |
      {{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}/logs/*.log {
          daily
          rotate 7
          compress
          delaycompress
          missingok
          notifempty
          su {{ app_user }} {{ app_group }}
      }
    dest: "/etc/logrotate.d/{{ app_user }}"
    mode: '0644'
  become: true


- name: Add user to groups video, audio, and render
  user:
    name: "{{ app_user }}"
    groups: video,audio,render
    append: yes



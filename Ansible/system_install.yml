# --- Rotation des logs ---
- name: "Configuration de la rotation des logs"
  copy:
    content: |
      {{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}/logs/*.log {
          daily
          rotate 7
          compress
          delaycompress
          missingok
          notifempty
          
      }
    dest: "/etc/logrotate.d/admin"
    mode: '0644'
  become: true
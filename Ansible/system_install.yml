- name: "Installer Node.js via NVM"
  block:
    - name: Installer les dépendances nécessaires
      apt:
        name:
          - curl
          - git
          - netcat-openbsd
        state: present
        update_cache: yes
      become: true

    - name: Créer le répertoire .nvm
      file:
        path: "/home/admin/.nvm"
        state: directory
        owner: admin
        group: admin
        mode: '0755'
      become: true

    - name: Installer NVM et Node.js 
      shell: |
        {{ nvm_load }}

        # Installer NVM si absent

        if [ ! -s "$NVM_DIR/nvm.sh" ]; then
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
        fi

        # Recharger NVM pour s'assurer qu'il est bien disponible

        {{ nvm_load }}

        # Installer Node.js et le définir par défaut
        nvm install {{ node_version }} || true
        nvm alias default {{ node_version }}
        nvm use default
      args:
        executable: /bin/bash
      become: true
      become_user: admin
      environment:
        HOME: /home/admin
      register: node_install

- name: Créer le groupe applicatif
  ansible.builtin.group:
    name: "{{ app_group }}"
    state: present

- name: Créer l'utilisateur applicatif
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    home: "{{ LOCATION_PATH }}"
    shell: "{{ shell }}"
    create_home: yes
    state: present

- name: "Configuration de la rotation des logs"
  copy:
    content: |
      {{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}/logs/*.log {
          daily
          rotate 7
          compress
          delaycompress
          missingok
          notifempty
          
      }
    dest: "/etc/logrotate.d/{{ app_user }}"
    mode: '0644'
  become: true

- name: "Créer le dossier SSH s'il n'existe pas"
  file:
    path: "{{ LOCATION_PATH }}/.ssh"
    state: directory
    mode: '0700'
    owner: "{{ app_user }}"
    group: "{{ app_group }}"


- name: "Assurer que AuthorizedKeysFile contient authorized_keys_gitlab"
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^AuthorizedKeysFile'
    line: 'AuthorizedKeysFile .ssh/authorized_keys .ssh/authorized_keys_gitlab'
    state: present
    backup: yes
  notify: reload ssh
  become: true

- name: "Récupérer la variable AUTHORIZED_KEYS "
  uri:
    url: "https://{{ REGISTRY_HOST }}/api/v4/projects/{{ project_id }}/variables/AUTHORIZED_KEYS"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ Env_token }}"
    return_content: yes
  register: gitlab_var

- name: "Extraire les clés SSH"
  set_fact:
    ssh_keys: "{{ gitlab_var.json.value.split('\n') }}"

- name: "Synchroniser les clés SSH"
  ansible.posix.authorized_key:
    user: "{{ app_user }}"
    key: "{{ ssh_keys | join('\n') }}"
    path: "/home/{{ app_user }}/.ssh/authorized_keys_gitlab"
    exclusive: yes
  notify: reload ssh

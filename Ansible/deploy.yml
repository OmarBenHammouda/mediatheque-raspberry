- name: "Nettoyage du répertoire d'application existant"
  file:
    path: "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}"
    state: absent
  become: true

- name: "Création des répertoires applicatifs"
  file:
    path: "{{ item }}"
    state: directory
    owner: "admin"
    group: "admin"
    mode: '0755'
  loop:
    - "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}"
    - "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}/logs"
    - "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}/releases"  
  become: true

- name: "Copie de l'archive du projet vers le répertoire accessible"
  copy:
    src: "{{ hostvars['localhost']['build_dir'] }}/{{ project_archive }}"
    dest: "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}/releases/{{ project_archive }}"
    owner: "admin"
    group: "admin"
    mode: '0644'
  become: true

- name: "Copie du fichier CI_COMMIT_SHORT_SHA"
  copy:
    src: "{{ hostvars['localhost']['build_dir'] }}/.{{ CI_COMMIT_SHORT_SHA }}."
    dest: "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}/"
    owner: "admin"
    group: "admin"
    mode: '0644'
  become: true

- name: "Re-création du répertoire d'application"
  file:
    path: "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}"
    state: directory
    owner: "admin"
    group: "admin"
    mode: '0755'
  become: true

- name: "Extraction de l'archive dans le répertoire d'application"
  unarchive:
    src: "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}/releases/{{ project_archive }}"
    dest: "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}"
    owner: "admin"
    group: "admin"
    remote_src: true
  become: true

- name: "Suppression de l'archive après extraction"
  file:
    path: "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}/releases"
    state: absent
  become: true

- name: "Créer le service systemd pour Raspberry Player"
  copy:
    content: |
      [Unit]
      Description=Raspberry Player - Médiathèque Digital Signage
      After=network.target graphical-session.target

      [Service]
      Type=simple
      User=admin
      Group=admin
      WorkingDirectory={{ LOCATION_PATH }}/{{ CI_PROJECT_NAME }}
      ExecStart=/usr/bin/npm start --prefix {{ LOCATION_PATH }}/{{ CI_PROJECT_NAME }}
      Restart=always
      RestartSec=10
      StandardOutput=journal
      StandardError=journal
      Environment=NODE_ENV=production
      Environment=DISPLAY=:0
      Environment=HOME=/home/admin
      Environment=XDG_RUNTIME_DIR=/run/user/1000

      # Redémarrage automatique en cas d'échec
      RestartForceExitStatus=1
      RestartPreventExitStatus=0

      [Install]
      WantedBy=graphical.target
    dest: "/etc/systemd/system/raspberry-player.service"
    mode: '0644'
    owner: root
    group: root
  become: true
  notify: reload systemd

- name: "Recharger systemd et activer le service Raspberry Player"
  ansible.builtin.systemd:
    name: raspberry-player
    enabled: yes
    daemon_reload: yes
    state: started
  become: true


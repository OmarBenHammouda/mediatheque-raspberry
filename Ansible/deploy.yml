- name: Arrêter raspberry-player 
  become: true
  ansible.builtin.systemd:
    name: raspberry-player
    state: stopped
  ignore_errors: true

- name: Lister les fichiers dans le répertoire 
  ansible.builtin.find:
    paths: "{{ LOCATION_PATH }}/{{ CI_PROJECT_NAME }}"
    file_type: any
  register: files_to_delete

- name: Supprimer le contenu du répertoire sauf files et data
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ files_to_delete.files }}"
  when: "'files' not in item.path and 'data' not in item.path"

- name: Supprimer tous les fichiers .commitId. ancien
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ lookup('ansible.builtin.fileglob', LOCATION_PATH ~ '/' ~ CI_PROJECT_NAME ~ '/.*.', wantlist=True) }}"
  become: true
  become_user: admin

- name: "Création des répertoires applicatifs"
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'
  loop:
    - "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}"
    - "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}/logs"
    - "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}/releases"  
  become: true

- name: "Copie de l'archive du projet vers le répertoire accessible"
  copy:
    src: "{{ hostvars['localhost']['build_dir'] }}/{{ project_archive }}"
    dest: "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}/releases/{{ project_archive }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0644'
  become: true

- name: "Copie du fichier CI_COMMIT_SHORT_SHA"
  copy:
    src: "{{ hostvars['localhost']['build_dir'] }}/.{{ CI_COMMIT_SHORT_SHA }}."
    dest: "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}/"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0644'
  become: true

- name: "Re-création du répertoire d'application"
  file:
    path: "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'
  become: true

- name: "Extraction de l'archive dans le répertoire d'application"
  unarchive:
    src: "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}/releases/{{ project_archive }}"
    dest: "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    remote_src: true
  become: true

- name: "Suppression de l'archive après extraction"
  file:
    path: "{{ LOCATION_PATH }}/{{CI_PROJECT_NAME}}/releases"
    state: absent
  become: true

- name: Récupérer UID de appuser via id
  command: id -u {{ app_user }} 
  register: appuser_uid 



- name: "Créer le service systemd pour Raspberry Player"
  copy:
    content: |
      [Unit]
      Description=Raspberry Player - Médiathèque Digital Signage
      After=network.target graphical.target

      [Service]
      Type=simple
      User={{ app_user }}
      Group={{ app_group }}
      WorkingDirectory={{ LOCATION_PATH }}/{{ CI_PROJECT_NAME }}

      ExecStart=/bin/bash -lc 'export NVM_DIR="/home/admin/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"; nvm use default; npm start --prefix {{ LOCATION_PATH }}/{{ CI_PROJECT_NAME }}'

      Restart=always
      RestartSec=10
      StandardOutput=journal
      StandardError=journal
      Environment=NODE_ENV=production
      Environment=DISPLAY=:0
      Environment=HOME={{ LOCATION_PATH }}
      Environment=XDG_RUNTIME_DIR=/run/user/{{ appuser_uid.stdout }}

      # Redémarrage automatique en cas d'échec
      RestartForceExitStatus=1
      RestartPreventExitStatus=0

      [Install]
      WantedBy=graphical.target
    dest: "/etc/systemd/system/raspberry-player.service"
    mode: '0644'
    owner: root
    group: root
  become: true
  notify: reload systemd

- name: "Recharger systemd et activer le service Raspberry Player"
  ansible.builtin.systemd:
    name: raspberry-player
    enabled: yes
    daemon_reload: yes
    state: started
  become: true

